# Builds the VSIX on every push and pull request; a v* tag also publishes it as a GitHub release.
# The asset keeps a fixed name, so releases/latest/download/VsNerdX.vsix always points at the newest one.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      # The tag and the manifest must name the same version, or Visual Studio would see a different one than the release.
      - name: Check the tag against the manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content VSNerdX-26/source.extension.vsixmanifest)).PackageManifest.Metadata.Identity.Version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME doesn't match the manifest version $version." }

      - name: Build
        run: msbuild VsNerdX.sln /restore /p:Configuration=Release /m /nologo /v:minimal

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item VSNerdX-26/bin/Release/VSNerdX-26.vsix dist/VsNerdX.vsix
          $hash = (Get-FileHash dist/VsNerdX.vsix -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/VsNerdX.vsix.sha256", "$hash  VsNerdX.vsix`n")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: dist/
          if-no-files-found: error

  # A separate job, so only tag builds get write access.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
